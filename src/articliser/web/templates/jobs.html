{% extends "base.html" %}
{% block title %}Queue &middot; Articliser{% endblock %}
{% block content %}
<div class="post narrow">
  <h1>Queue</h1>
  <p class="standfirst">Refreshes every few seconds while the worker runs.</p>
  <table class="jobs">
    <thead><tr><th>Job</th><th>Status</th><th>Queued</th><th>Detail</th></tr></thead>
    <tbody hx-get="/jobs/rows" hx-trigger="load, every 4s" hx-swap="innerHTML">
      {% include "_job_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
